name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      api_base:
        description: "API_BASE cho bản build"
        required: false
        default: "https://chamxanh-api.onrender.com"

env:
  FLUTTER_VERSION: "3.35.7"
  API_BASE: ${{ github.event.inputs.api_base || 'https://chamxanh-api.onrender.com' }}

jobs:
  test:
    name: Analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=API_BASE=${{ env.API_BASE }}
      - uses: actions/upload-artifact@v4
        with:
          name: cham-xanh-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  ios:
    name: iOS (chưa ký)
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --dart-define=API_BASE=${{ env.API_BASE }}
      - name: Đóng gói IPA chưa ký
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa && zip -qr cham-xanh-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: cham-xanh-ios-unsigned
          path: build/ipa/cham-xanh-unsigned.ipa
          retention-days: 14
