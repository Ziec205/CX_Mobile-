name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      api_base:
        description: "API_BASE cho bản build"
        required: false
        default: "https://cx-be.onrender.com"

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.35.7"
  API_BASE: ${{ github.event.inputs.api_base || 'https://cx-be.onrender.com' }}

jobs:
  test:
    name: Analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=API_BASE=${{ env.API_BASE }}
      - uses: actions/upload-artifact@v4
        with:
          name: cham-xanh-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
      - name: Đưa APK lên bản thử mới nhất (link tải cố định)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk cham-xanh.apk
          NOTES="Bản thử tự động từ commit ${GITHUB_SHA::7} ($(date -u +%F)). Máy chủ: ${{ env.API_BASE }}. Cài: tải cham-xanh.apk trên điện thoại Android, cho phép cài từ nguồn này."
          gh release view ban-thu-moi-nhat >/dev/null 2>&1 || gh release create ban-thu-moi-nhat --prerelease --title "Bản thử mới nhất (Android)" --notes "$NOTES"
          gh release edit ban-thu-moi-nhat --notes "$NOTES" --target "$GITHUB_SHA"
          gh release upload ban-thu-moi-nhat cham-xanh.apk --clobber

  ios:
    name: iOS (chưa ký)
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --dart-define=API_BASE=${{ env.API_BASE }}
      - name: Đóng gói IPA chưa ký
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa && zip -qr cham-xanh-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: cham-xanh-ios-unsigned
          path: build/ipa/cham-xanh-unsigned.ipa
          retention-days: 14
