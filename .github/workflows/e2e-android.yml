name: E2E Android (máy ảo)

# Dựng BE thật (.NET + MongoDB) với dữ liệu mẫu, bật máy ảo Android, chạy integration test đi qua mọi màn hình,
# chụp ảnh và tạo tài liệu PDF hướng dẫn có mũi tên đỏ chỉ từng nút.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['lib/**', 'integration_test/**', 'tool/e2e/**', '.github/workflows/e2e-android.yml']

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Ziec205/CX_BE
          path: be
      - name: Bật KVM cho máy ảo
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true
      - name: MongoDB (replica set)
        run: |
          set -o pipefail
          curl -sSfL https://fastdl.mongodb.org/linux/mongodb-linux-x86_64-ubuntu2404-8.0.4.tgz -o /tmp/mongo.tgz \
            || { echo "::error::Không tải được MongoDB"; exit 1; }
          mkdir -p /tmp/mongo /tmp/mongo-data && tar -xzf /tmp/mongo.tgz -C /tmp/mongo --strip-components=1
          /tmp/mongo/bin/mongod --dbpath /tmp/mongo-data --replSet rs0 --bind_ip 127.0.0.1 --port 27017 --fork --logpath /tmp/mongod.log \
            || { echo "::error::mongod không chạy: $(tail -5 /tmp/mongod.log | tr '\n' ' ')"; exit 1; }
          pip install --quiet pymongo
          python3 - <<'PY'
          import time
          from pymongo import MongoClient
          c = MongoClient('mongodb://127.0.0.1:27017/?directConnection=true', serverSelectionTimeoutMS=5000)
          try:
              c.admin.command('replSetInitiate', {'_id': 'rs0', 'members': [{'_id': 0, 'host': '127.0.0.1:27017'}]})
          except Exception as e:
              print('replSetInitiate:', e)
          for _ in range(60):
              if c.admin.command('hello').get('isWritablePrimary'):
                  print('MongoDB sẵn sàng'); break
              time.sleep(1)
          else:
              print('::error::MongoDB không thành primary'); raise SystemExit(1)
          PY
      - name: Chạy BE
        run: |
          dotnet publish be/src/ChamXanh.Api -c Release -o /tmp/be
          cd /tmp/be
          ASPNETCORE_ENVIRONMENT=Development ASPNETCORE_URLS=http://0.0.0.0:5080 \
            ConnectionStrings__Mongo="mongodb://127.0.0.1:27017/?replicaSet=rs0" Mongo__Database=chamxanh_e2e \
            PayOS__AllowSimulator=true nohup dotnet ChamXanh.Api.dll > /tmp/be.log 2>&1 &
          for i in $(seq 1 90); do curl -sf localhost:5080/health && exit 0; sleep 2; done
          echo "::error::BE không chạy: $(tail -20 /tmp/be.log | tr '\n' ' ' | cut -c1-900)"; exit 1
      - name: Dữ liệu mẫu
        run: |
          pip install --quiet pillow reportlab
          python3 tool/e2e/make_plants.py /tmp/img
          python3 tool/e2e/seed.py http://localhost:5080 http://10.0.2.2:5080 /tmp/img > /tmp/seed.json \
            || { echo "::error::Seed lỗi: $(tail -c 600 /tmp/seed.json)"; exit 1; }
          echo "LISTING_ID=$(python3 -c "import json;print(json.load(open('/tmp/seed.json'))['listingId'])")" >> $GITHUB_ENV
          echo "SELLER_TOKEN=$(python3 -c "import json;print(json.load(open('/tmp/seed.json'))['sellerToken'])")" >> $GITHUB_ENV
      - run: flutter pub get
      - name: Máy ảo Android + integration test
        timeout-minutes: 45
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: SHOTS_DIR=$PWD/build/shots bash tool/e2e/run_android.sh; adb logcat -d -t 3000 > $PWD/build/logcat.txt 2>/dev/null || true
      - name: Tạo PDF hướng dẫn
        if: always()
        run: |
          python3 tool/e2e/build_pdf.py build/shots build/shots/Huong-dan-app-Cham-Xanh.pdf assets/fonts \
            ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png "máy ảo Android (Pixel 6, Android 12)" || true
      - name: Gom log
        if: always()
        run: |
          mkdir -p build/logs
          cp /tmp/drive.log /tmp/be.log /tmp/mongod.log build/logs/ 2>/dev/null || true
          cp build/logcat.txt build/logs/ 2>/dev/null || true
          grep -aE "Đã chụp|Không thấy|Exception|All tests|Test failed" /tmp/drive.log | tail -20 | while read -r l; do echo "::notice::$l"; done || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-android-anh-chup-va-pdf
          path: |
            build/shots/*.png
            build/shots/shots.json
            build/shots/*.pdf
            build/logs/
      - name: Log BE khi lỗi
        if: failure()
        run: tail -100 /tmp/be.log
